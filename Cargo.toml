
[package]
name = "fractal"
version = "0.1.0"
edition = "2021"

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.4", features = ["derive"], optional = true } # CLI argument parsing
brik = "0.10"                                           # HTML5 parsing/querying
fs2 = "0.4"                                             # Cross-process project locking
serde = { version = "1.0", features = ["derive"] }      # Serialization
serde_json = "1.0"                                      # JSON support
sha2 = "0.10"                                           # Page content hashes
tempfile = "3"                                          # Same-filesystem transaction staging

[[bin]]
name = "fractal"
path = "src/main.rs"
required-features = ["cli"]
